name: Publish image

on:
  workflow_dispatch:
    inputs:
      autoWithLatestTag:
        description: 'Auto Add Latest Tag'
        required: true
        default: true
        type: boolean
  release:
    types: [created]

# 推送镜像到 GHCR 需要 packages: write；fork 仓库的默认令牌常常只有只读权限
permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  GHCR_USERNAME: ${{ github.repository_owner }}
  GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  GHC_IMG_NAME: "ghcr.io/${{ github.repository_owner }}/bili_tool_web"

jobs:
  PublishImage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: GetTargetVersion
        id: getTargetVersion
        run: |
          TargetVersion=""
          if [ "${{ github.event.release.tag_name }}" ] ; then
            TargetVersion=${{ github.event.release.tag_name }}
          else
            TargetVersion=$(grep -oP '(?<=<Version>).*?(?=<\/Version>)' ./common.props)
          fi
          echo "TargetVersion: $TargetVersion"
          echo "TargetVersion=$TargetVersion" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 未配置 DockerHub 凭据时只推送 GHCR，避免空用户名导致登录失败
      - name: Login to DockerHub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Log in to ghcr
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PASSWORD }}

      - name: Generate tags
        id: tags
        run: |
          targetVersion="${{ steps.getTargetVersion.outputs.TargetVersion }}"
          withLatest=""
          if [ "${{ github.event.inputs.autoWithLatestTag }}" == "true" ] || [ -n "${{ github.event.release.created_at }}" ]; then
            withLatest="true"
          fi

          {
            echo "tags<<TAGS"
            echo "${GHC_IMG_NAME}:${targetVersion}"
            if [ -n "$withLatest" ]; then
              echo "${GHC_IMG_NAME}:latest"
            fi
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "${DOCKERHUB_USERNAME}/bili_tool_web:${targetVersion}"
              if [ -n "$withLatest" ]; then
                echo "${DOCKERHUB_USERNAME}/bili_tool_web:latest"
              fi
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
