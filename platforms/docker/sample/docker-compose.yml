services:
  bili_tool_web:
    image: ghcr.io/angussleeping/bili_tool_web
    container_name: bili_tool_web
    restart: unless-stopped
    tty: true
    volumes:
      - ./Logs:/app/Logs
      - ./config:/app/config
      - ./keys:/app/keys # DataProtection keys; keeps login sessions valid across container rebuilds
    ports:
      - "22330:8080"
    environment:
      TZ: "Asia/Shanghai"
      DailyTaskConfig__Cron: "0 0 15 * * ?"
      # Container runs as this uid/gid (drops from root via gosu); align with the
      # owner of the host-mounted directories above
      PUID: "1000"
      PGID: "1000"
